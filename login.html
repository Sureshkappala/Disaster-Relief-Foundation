<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your disaster relief dashboard.">
    <title>Login | Disaster Relief Foundation</title>
    <link rel="stylesheet" href="css/style.css?v=6.0">
</head>
<body class="auth-page">

    <!-- Back to Home Button in top left -->
    <a href="index.html" class="back-to-home" aria-label="Return to homepage">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>Back to Home</span>
    </a>

    <!-- Center Auth Card -->
    <div class="auth-card">
        <div class="auth-header">
            <!-- Stackly Logo -->
            <img src="images/logo.webp" alt="Stackly Logo" style="height: 38px; width: auto; object-fit: contain; margin: 0 auto 20px; display: block; filter: invert(1);">
            <h2>Welcome Back</h2>
            <p>Log in to access your secure disaster portals.</p>
        </div>
        
        <form id="login-active-form" data-validate>
            <!-- Access Role -->
            <div class="form-group">
                <label class="form-label" for="role">Access Role *</label>
                <select id="role" name="role" class="form-control" required style="cursor: pointer; appearance: none; -webkit-appearance: none;">
                    <option value="user" selected>Client / User</option>
                    <option value="admin">EOC Administrator</option>
                </select>
            </div>

            <!-- Email Address -->
            <div class="form-group">
                <label class="form-label" for="email">Email Address *</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="user@stackly.org" required>
                <p id="role-help-desc" style="font-size: 0.8rem; color: rgba(255, 255, 255, 0.45); margin-top: 6px; line-height: 1.4; transition: opacity 0.3s;"></p>
            </div>
            
            <!-- Password -->
            <div class="form-group">
                <label class="form-label" for="password">Password *</label>
                <div class="password-input-wrapper">
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                    <button type="button" class="password-toggle-icon" aria-label="Toggle password visibility" style="top: 50%; right: 16px;">
                        <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                    </button>
                </div>
            </div>
            
            <!-- Remember Me & Forgot Password -->
            <div class="auth-options" style="margin-bottom: 30px;">
                <label class="form-check" style="margin-bottom: 0;">
                    <input type="checkbox" name="remember" class="form-check-input">
                    <span class="form-check-label">Remember this device</span>
                </label>
                <a href="404.html" class="forgot-password">Forgot password?</a>
            </div>
            
            <!-- Sign In button -->
            <button type="submit" class="btn btn-primary btn-block" style="gap: 10px;">
                <!-- Sign in arrow SVG icon -->
                <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: currentColor;" aria-hidden="true"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
                <span>Sign In</span>
            </button>
        </form>
        
        <!-- Demo Credentials Info Box -->
        <div style="margin: 25px 0 15px; padding: 15px; border-radius: var(--radius-sm); background-color: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); font-size: 0.85rem; text-align: left;">
            <p style="margin: 0; color: rgba(255,255,255,0.85); font-weight: 600; display: flex; align-items: center; gap: 6px;">
                <svg viewBox="0 0 24 24" style="width: 14px; height: 14px; fill: #00E676;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                Demo Login Credentials:
            </p>
            <p style="margin: 6px 0 0; color: rgba(255,255,255,0.65);">
                User Role: <code style="color: #00E676; background: rgba(0,230,118,0.1); padding: 2px 6px; border-radius: 3px;">user@stackly.org</code> / <code style="color: #00E676; background: rgba(0,230,118,0.1); padding: 2px 6px; border-radius: 3px;">user123</code>
            </p>
            <p style="margin: 6px 0 0; color: rgba(255,255,255,0.65);">
                Admin Role: <code style="color: #00E676; background: rgba(0,230,118,0.1); padding: 2px 6px; border-radius: 3px;">admin@stackly.org</code> / <code style="color: #00E676; background: rgba(0,230,118,0.1); padding: 2px 6px; border-radius: 3px;">admin123</code>
            </p>
        </div>
        
        <!-- Footer Sign Up link -->
        <div class="auth-footer">
            <p>Don't have an account? <a href="register.html">Sign Up</a></p>
        </div>
    </div>

    <script src="js/validation.js?v=1.1"></script>
    <script src="js/main.js?v=2.6"></script>
</body>
</html>
