<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register an account with Stackly as a volunteer, donor, or regional coordinator.">
    <title>Register | Stackly Vault Portal</title>
    <link rel="stylesheet" href="css/style.css?v=4.3">
</head>
<body class="auth-page" style="padding: 40px 24px;">

    <!-- Back to Home Button in top left -->
    <a href="index.html" class="back-to-home" aria-label="Return to homepage">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>Back to Home</span>
    </a>

    <!-- Center Auth Card -->
    <div class="auth-card" style="max-width: 540px;">
        <div class="auth-header">
            <!-- Stackly Logo -->
            <img src="images/logo.webp" alt="Stackly Logo" style="height: 38px; width: auto; object-fit: contain; margin: 0 auto 20px; display: block;">
            <h2>Join Stackly</h2>
            <p>Register as a volunteer, donor, or coordinator</p>
        </div>
        
        <form id="register-active-form" data-validate>
            <!-- Full Name -->
            <div class="form-group">
                <label class="form-label" for="fullname">Full Name *</label>
                <input type="text" id="fullname" name="fullname" class="form-control" placeholder="e.g. Samuel Jackson" required>
            </div>
            
            <div class="form-row">
                <!-- Email Address -->
                <div class="form-group">
                    <label class="form-label" for="email">Email Address *</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="sam@example.com" required>
                </div>
                <!-- Mobile Number -->
                <div class="form-group">
                    <label class="form-label" for="mobile">Mobile Number *</label>
                    <input type="tel" id="mobile" name="mobile" class="form-control" placeholder="5550199" required>
                </div>
            </div>
            
            <!-- Access Role -->
            <div class="form-group">
                <label class="form-label" for="role">Access Role *</label>
                <select id="role" name="role" class="form-control" required style="cursor: pointer; appearance: none; -webkit-appearance: none;">
                    <option value="user" selected>Client / User</option>
                    <option value="admin">EOC Administrator</option>
                </select>
            </div>
            
            <div class="form-row">
                <!-- Password -->
                <div class="form-group">
                    <label class="form-label" for="password">Password *</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                        <button type="button" class="password-toggle-icon" aria-label="Toggle password visibility" style="top: 50%; right: 16px;">
                            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                        </button>
                    </div>
                </div>
                <!-- Confirm Password -->
                <div class="form-group">
                    <label class="form-label" for="confirm-password">Confirm Password *</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="confirm-password" name="confirm-password" class="form-control" placeholder="••••••••" required>
                        <button type="button" class="password-toggle-icon" aria-label="Toggle password visibility" style="top: 50%; right: 16px;">
                            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Terms Accept -->
            <div class="form-check" style="margin-bottom: 25px;">
                <input type="checkbox" id="terms" name="terms" class="form-check-input" required data-field-name="Terms and Conditions">
                <label class="form-check-label" for="terms">
                    I agree to Stackly's <a href="404.html">Privacy Policy</a> and <a href="404.html">Terms of Service</a>.
                </label>
            </div>
            
            <!-- Sign Up button -->
            <button type="submit" class="btn btn-primary btn-block" style="gap: 10px;">
                <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: currentColor;" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
                <span>Create Account</span>
            </button>
        </form>
        
        <!-- Footer Sign In link -->
        <div class="auth-footer">
            <p>Already have an account? <a href="login.html">Sign In Here</a></p>
        </div>
    </div>

    <script src="js/validation.js"></script>
    <script src="js/main.js?v=2.0"></script>
</body>
</html>
