<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Oops! The page you are looking for has been washed away or moved. Return to the Stackly home page.">
    <title>Sector Not Found (404) | Stackly Portal</title>
    <link rel="stylesheet" href="css/style.css?v=5.4">
</head>
<body class="auth-page" style="text-align: center;">

    <!-- Centered Error Card -->
    <div class="auth-card" style="max-width: 520px; padding: 50px 40px;">
        <!-- Large 404 text -->
        <div style="font-size: 6.5rem; font-weight: 800; color: var(--color-secondary); line-height: 1; margin-bottom: 20px; letter-spacing: -2px;">
            404
        </div>
        
        <h2 style="font-size: 1.8rem; font-weight: 700; color: white; margin-bottom: 16px;">
            Sector Not Found
        </h2>
        
        <p style="color: rgba(255, 255, 255, 0.65); font-size: 0.95rem; line-height: 1.6; margin-bottom: 35px;">
            The relief sector coordinates or directory target you are trying to access do not exist or have been relocated to another active zone.
        </p>
        
        <!-- Action Buttons inline -->
        <div style="display: flex; gap: 15px; justify-content: center;">
            <a href="index.html" class="btn btn-primary" style="gap: 8px; padding: 12px 22px; border-radius: var(--radius-sm);">
                <svg viewBox="0 0 24 24" style="width: 16px; height: 16px; fill: currentColor;" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>Back to Home</span>
            </a>
            
            <button id="go-back-btn" class="btn btn-outline-white" style="gap: 8px; padding: 12px 22px; border-radius: var(--radius-sm); border-color: rgba(255,255,255,0.25);">
                <svg viewBox="0 0 24 24" style="width: 16px; height: 16px; fill: currentColor;" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                <span>Go Back</span>
            </button>
        </div>
    </div>

    <script>
        document.getElementById('go-back-btn').addEventListener('click', () => {
            window.history.back();
        });
    </script>
</body>
</html>
